name: Inspect updater source 3.18.0
on:
  push:
    branches: [work/v3.20.14-corrected]
    paths:
      - '.github/workflows/inspect-updater-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve updater source from historic release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/zk-src
          gh release download v3.18.0 --repo '${{ github.repository }}' --pattern 'ZKStrap_v3_18_0_UPDATE_CENTER.zip' --dir /tmp/zk-src
          unzip -qq /tmp/zk-src/ZKStrap_v3_18_0_UPDATE_CENTER.zip -d /tmp/zk-src/extracted
          find /tmp/zk-src/extracted -iname '*update*.py' -o -iname 'ZKUpdater.py'
          path="$(find /tmp/zk-src/extracted -name ZKUpdater.py | head -n 1)"
          test -n "$path"
          mkdir -p tools/updater
          cp "$path" tools/updater/ZKUpdater_original.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/updater/ZKUpdater_original.py
          git commit -m 'Record historical updater source for reliability repair'
          git push origin HEAD:work/v3.20.14-corrected
