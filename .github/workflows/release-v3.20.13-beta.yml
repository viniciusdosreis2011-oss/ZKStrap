name: Release ZKStrap v3.20.13 Beta ANI and 18 Track Audio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v3.20.13-beta.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download v3.18.0 source package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path input | Out-Null
          gh release download v3.18.0 --repo '${{ github.repository }}' --pattern 'ZKStrap_v3_18_0_UPDATE_CENTER.zip' --dir input
          Expand-Archive -Path 'input/ZKStrap_v3_18_0_UPDATE_CENTER.zip' -DestinationPath source -Force
          $root = Get-ChildItem source -Directory | Select-Object -First 1
          if (-not $root) { throw 'Could not find extracted source.' }
          "ZK_SOURCE=$($root.FullName)" >> $env:GITHUB_ENV

      - name: Decode patch and tool payloads
        shell: pwsh
        run: |
          foreach ($name in @('v3_18_1_base','v3_18_1_post','v3_18_2','v3_18_4')) {
            $b64=(Get-Content "patches/$name.py.gz.b64" -Raw).Trim()
            [IO.File]::WriteAllBytes("$name.gz",[Convert]::FromBase64String($b64))
            python -c "import gzip,pathlib; n='$name'; pathlib.Path(n+'.py').write_bytes(gzip.decompress(pathlib.Path(n+'.gz').read_bytes()))"
          }
          python patches/v3_18_5_patchfix.py
          foreach ($pair in @(@('generate_v3213_audio','tools/generate_v3213_audio.py.gz.b64'),@('test_v3213_ani_parser','tools/test_v3213_ani_parser.py.gz.b64'))) {
            $name=$pair[0];$src=$pair[1];$b64=(Get-Content $src -Raw).Trim()
            [IO.File]::WriteAllBytes("$name.gz",[Convert]::FromBase64String($b64))
            python -c "import gzip,pathlib; n='$name'; pathlib.Path('tools/'+n+'.py').write_bytes(gzip.decompress(pathlib.Path(n+'.gz').read_bytes()))"
          }

      - name: Validate v3.20.13 scripts
        shell: pwsh
        run: |
          python -m py_compile patches/v3_20_13.py patches/v3_20_13_winapi.py tools/generate_v3213_audio.py tools/test_v3213_ani_parser.py

      - name: Rebuild and validate v3.20.13 source
        shell: pwsh
        run: |
          $env:ZK_SOURCE_DIR=$env:ZK_SOURCE
          python v3_18_1_base.py
          python v3_18_1_post.py
          python v3_18_2.py
          python patches/v3_18_3.py
          python v3_18_4.py
          python patches/v3_18_5.py
          python patches/v3_18_6.py
          python patches/v3_18_7.py
          python patches/v3_18_8.py
          python patches/v3_18_9.py
          python patches/v3_19_0.py
          python patches/v3_19_1.py
          python patches/v3_19_2.py
          python patches/v3_19_3.py
          python patches/v3_19_4_fixed.py
          python patches/v3_19_5.py
          python patches/v3_19_6.py
          python patches/v3_19_7_runtime.py
          python patches/v3_19_8.py
          python patches/v3_19_9.py
          python patches/v3_20_0.py
          python patches/v3_20_1.py
          python patches/v3_20_2.py
          python patches/v3_20_3.py
          python patches/v3_20_4_onboarding.py
          python patches/v3_20_4_ani.py
          python patches/v3_20_5.py
          python patches/v3_20_6.py
          python patches/v3_20_7.py
          python patches/v3_20_8.py
          python patches/v3_20_9.py
          python patches/v3_20_10.py
          python patches/v3_20_11.py
          python patches/v3_20_12.py
          @'
          import ast,hashlib,os,pathlib
          p=pathlib.Path(os.environ['ZK_SOURCE'])/'ZKStrap_v3_18_0.py';s=p.read_text(encoding='utf-8');tree=ast.parse(s)
          app=next(n for n in tree.body if isinstance(n,ast.ClassDef) and n.name=='ModernConfigApp')
          chunks=[]
          for n in app.body:
              if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)) and 'spotify' in n.name.lower():chunks.append(ast.get_source_segment(s,n) or '')
          pathlib.Path('spotify_before.sha').write_text(hashlib.sha256('\n'.join(chunks).encode()).hexdigest())
          '@ | Set-Content spotify_fingerprint.py -Encoding UTF8
          python spotify_fingerprint.py
          python patches/v3_20_13.py
          python patches/v3_20_13_winapi.py
          python -m py_compile "$env:ZK_SOURCE/ZKStrap_v3_18_0.py"
          @'
          import ast,hashlib,os,pathlib
          p=pathlib.Path(os.environ['ZK_SOURCE'])/'ZKStrap_v3_18_0.py';s=p.read_text(encoding='utf-8');tree=ast.parse(s)
          app=next(n for n in tree.body if isinstance(n,ast.ClassDef) and n.name=='ModernConfigApp')
          sound=next(n for n in tree.body if isinstance(n,ast.ClassDef) and n.name=='ZKSoundManager')
          methods={n.name for n in app.body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))}
          chunks=[]
          for n in app.body:
              if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)) and 'spotify' in n.name.lower():chunks.append(ast.get_source_segment(s,n) or '')
          before=pathlib.Path('spotify_before.sha').read_text().strip();after=hashlib.sha256('\n'.join(chunks).encode()).hexdigest()
          if before!=after:raise SystemExit('Spotify methods changed unexpectedly')
          assigns={}
          for n in tree.body:
              if isinstance(n,ast.Assign) and len(n.targets)==1 and isinstance(n.targets[0],ast.Name):assigns[n.targets[0].id]=n.value
          packs=ast.literal_eval(assigns['AUDIO_PACKS'])
          if len(packs)!=18:raise SystemExit(f'expected 18 audio identities, got {len(packs)}')
          expected={'VOID DRIVE':145,'NIGHT RUNNER':170,'NO SIGNAL':132,'NEON HEART':138,'SYSTEM BREACH':128,'OVERCLOCK':174,'MIDNIGHT.exe':105,'AFTER HOURS':82,'REDLINE':150,'GLITCHED':160,'ABYSS':68,'FINAL PHASE':156,'PIXEL RUSH':165,'ICE COLD':140,'LOW GRAVITY':134,'BLACKOUT':120,'SUNSET MODE':95,'LAST ROUND':185}
          if {k:int(v['bpm']) for k,v in packs.items()}!=expected:raise SystemExit('audio identity/BPM table mismatch')
          checks=['APP_VERSION = "3.20.13"','def _cursor_overlay_native_ani_frames','invalid RIFF/ACON ANI',"low==b'rate'","low in (b'seq '",'18 músicas originais','v3213_']
          for x in checks:
              if x not in s:raise SystemExit('missing '+x)
          for need in ('_cursor_overlay_preview_refresh','_cursor_overlay_start','_lazy_build_page_audio','_combo_bind_modal_scroll'):
              if need not in methods:raise SystemExit('missing app method '+need)
          if 'RedrawWindow(' in s:raise SystemExit('unsafe repaint returned')
          print('v3.20.13 source validation OK; Spotify fingerprint unchanged')
          '@ | Set-Content validate_3213.py -Encoding UTF8
          python validate_3213.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:ZK_SOURCE/requirements.txt" pyinstaller numpy

      - name: Test ANI parser variants
        shell: pwsh
        run: |
          $env:ZK_SOURCE_DIR=$env:ZK_SOURCE
          python tools/test_v3213_ani_parser.py

      - name: Generate 18 independent long-form tracks
        shell: pwsh
        run: |
          $env:ZK_SOURCE_DIR=$env:ZK_SOURCE
          python tools/generate_v3213_audio.py

      - name: Validate 18-track music library
        shell: pwsh
        run: |
          @'
          import ast,json,os,pathlib,wave,hashlib,numpy as np
          root=pathlib.Path(os.environ['ZK_SOURCE']);report=json.loads((root/'v3213_audio_report.json').read_text(encoding='utf-8'))
          if len(report)!=18:raise SystemExit(f'expected 18 tracks, got {len(report)}')
          expected={'VOID DRIVE':145,'NIGHT RUNNER':170,'NO SIGNAL':132,'NEON HEART':138,'SYSTEM BREACH':128,'OVERCLOCK':174,'MIDNIGHT.exe':105,'AFTER HOURS':82,'REDLINE':150,'GLITCHED':160,'ABYSS':68,'FINAL PHASE':156,'PIXEL RUSH':165,'ICE COLD':140,'LOW GRAVITY':134,'BLACKOUT':120,'SUNSET MODE':95,'LAST ROUND':185}
          if {x['name']:int(x['bpm']) for x in report}!=expected:raise SystemExit('report identity/BPM mismatch')
          if len({x['genre'] for x in report})!=18:raise SystemExit('genres are not unique')
          if len({x['sha256'] for x in report})!=18:raise SystemExit('duplicate full tracks')
          for x in report:
              sec=float(x['duration'])
              if not 120<=sec<=165:raise SystemExit('duration outside 2:00-2:45 '+repr(x))
              if x.get('sections')!=['intro','A','change','B','break','final']:raise SystemExit('missing song structure '+repr(x))
              p=root/x['file']
              if not p.is_file():raise SystemExit('missing '+str(p))
              with wave.open(str(p),'rb') as w:
                  if w.getnchannels()!=1 or w.getsampwidth()!=2:raise SystemExit('unexpected WAV format '+str(p))
                  first=w.readframes(min(w.getnframes(),w.getframerate()*8))
              x['first8']=hashlib.sha256(first).hexdigest()
          if len({x['first8'] for x in report})!=18:raise SystemExit('two songs share the same opening audio')
          gen=ast.parse(pathlib.Path('tools/generate_v3213_audio.py').read_text(encoding='utf-8'))
          composers=[n.name for n in gen.body if isinstance(n,ast.FunctionDef) and n.name.startswith('compose_')]
          if len(composers)!=18:raise SystemExit(f'expected 18 separate composer functions, got {len(composers)}')
          packroot=root/'zkstrap_assets'/'sounds'/'packs'
          for x in report:
              d=packroot/x['slug'];wavs=list(d.glob('ambient*.wav'))
              if len(wavs)!=1 or 'v3213_' not in wavs[0].name:raise SystemExit('bad ambient contents '+x['slug']+' '+repr([p.name for p in wavs]))
          print('18-track validation OK: unique composers, BPMs, structures, openings and WAV hashes')
          '@ | Set-Content validate_music_3213.py -Encoding UTF8
          python validate_music_3213.py

      - name: Build updater
        shell: pwsh
        run: |
          Set-Location $env:ZK_SOURCE
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "ZKUpdater" --distpath "updater_dist" --workpath "updater_build" --specpath "updater_spec" "ZKUpdater.py"
          if (-not (Test-Path "updater_dist/ZKUpdater.exe")) { throw 'Updater build failed.' }

      - name: Build ZKStrap v3.20.13 ONEDIR
        shell: pwsh
        run: |
          Set-Location $env:ZK_SOURCE
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "ZKStrap" `
            --hidden-import "winrt.windows.media.control" --hidden-import "winrt.windows.storage.streams" `
            --hidden-import "winrt.windows.foundation" --hidden-import "winrt.windows.foundation.collections" `
            --collect-all "winrt.windows.media.control" --collect-all "winrt.windows.storage.streams" `
            --collect-all "winrt.windows.foundation" --collect-all "winrt.windows.foundation.collections" `
            --hidden-import "pycaw.pycaw" --hidden-import "pycaw.api.endpointvolume" --hidden-import "comtypes" --hidden-import "comtypes.client" `
            --collect-all "pycaw" --collect-all "comtypes" `
            --icon "zkstrap_icon.ico" --add-data "zkstrap_icon.ico;." --add-data "zkstrap_icon.png;." --add-data "zkstrap_assets;zkstrap_assets" `
            "ZKStrap_v3_18_0.py"
          if (-not (Test-Path "dist/ZKStrap/ZKStrap.exe")) { throw 'ZKStrap build failed.' }
          Copy-Item "updater_dist/ZKUpdater.exe" "dist/ZKStrap/ZKUpdater.exe" -Force

      - name: Package
        id: pkg
        shell: pwsh
        run: |
          $dist=Join-Path $env:ZK_SOURCE 'dist/ZKStrap'
          $name='ZKStrap-v3.20.13-beta-win64.zip'
          Compress-Archive -Path "$dist/*" -DestinationPath $name -CompressionLevel Optimal -Force
          $hash=(Get-FileHash $name -Algorithm SHA256).Hash.ToLower();$size=(Get-Item $name).Length
          "name=$name" >> $env:GITHUB_OUTPUT;"sha256=$hash" >> $env:GITHUB_OUTPUT;"size=$size" >> $env:GITHUB_OUTPUT

      - name: Publish v3.20.13 Beta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='v3.20.13-beta'
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag '${{ steps.pkg.outputs.name }}' --repo '${{ github.repository }}' --prerelease --title 'ZKStrap v3.20.13 Beta — ANI Parser + 18 Track Audio Rebuild' --notes @'
          ## v3.20.13 Beta
          - Rewrites the ANI reader around RIFF/ACON chunks and supports nested LIST/fram, anih timing, rate tables and seq frame ordering.
          - Supports full CUR/ICO payloads, raw RT_CURSOR payloads, PNG-backed frames and DIB-backed frames.
          - Adds a Windows DrawIconEx fallback for ANI files Windows can load but Pillow cannot decode directly.
          - Importing an ANI never deletes/rejects the original merely because preview decoding fails; the original file stays selected.
          - Animated cursor thumbnail uses the parsed frame timings when available; CUR remains static.
          - Replaces the old 10 music packs with 18 named music identities from VOID DRIVE through LAST ROUND.
          - Every identity has its requested BPM, a separate composer/groove/arrangement path, and a real 2:00–2:45 long-form track with intro/A/change/B/break/final sections.
          - Removes the v3.20.12 generated ambience from hidden legacy packs so it cannot leak into the new identities.
          - Spotify code is fingerprint-checked unchanged during CI.
          - Combo Planner wheel, guided tutorial, onboarding and the rest of v3.20.12 remain intact.
          - Stable channel remains unchanged.
          '@
          } else { gh release upload $tag '${{ steps.pkg.outputs.name }}' --clobber --repo '${{ github.repository }}' }

      - name: Update Beta manifest
        shell: pwsh
        run: |
          $m=[ordered]@{channel='beta';version='3.20.13';published_at=(Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ');mandatory=$false;min_updater_version='1.0.0';package_url='https://github.com/${{ github.repository }}/releases/download/v3.20.13-beta/ZKStrap-v3.20.13-beta-win64.zip';sha256='${{ steps.pkg.outputs.sha256 }}';size_bytes=[int64]'${{ steps.pkg.outputs.size }}';notes=@('Parser .ANI refeito para RIFF/ACON, anih/rate/seq e variações de payload de cursor.','Fallback nativo do Windows tenta renderizar ANI válidos que não abrem diretamente no Pillow.','A aba Áudio agora possui 18 músicas realmente distintas, de VOID DRIVE a LAST ROUND, todas entre 2:00 e 2:45.','Cada faixa tem BPM, groove, harmonia, instrumentos e estrutura próprios.','Spotify não foi alterado.','Correções da v3.20.12, incluindo scroll do Combo Planner e Guided Mode, permanecem.')}
          $m|ConvertTo-Json -Depth 5|Set-Content channels/beta.json -Encoding UTF8
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add channels/beta.json;git commit -m 'Point Beta channel to ZKStrap v3.20.13';git pull --rebase origin main;git push origin HEAD:main

      - name: Summary
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY '### ZKStrap v3.20.13 Beta published'
          Add-Content $env:GITHUB_STEP_SUMMARY 'Robust RIFF/ACON ANI + native fallback + 18 independent long-form music identities.'
          Add-Content $env:GITHUB_STEP_SUMMARY 'SHA-256: ${{ steps.pkg.outputs.sha256 }}'
          Add-Content $env:GITHUB_STEP_SUMMARY 'Size: ${{ steps.pkg.outputs.size }} bytes'
