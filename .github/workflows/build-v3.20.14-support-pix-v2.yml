name: Build ZKStrap v3.20.14 Pix Support v2

on:
  push:
    branches: [work/v3.20.14-corrected]
    paths:
      - '.github/workflows/build-v3.20.14-support-pix-v2.yml'
      - 'patches/v3_20_14_support_pix.py'
      - 'patches/v3_20_14_support_pix_runner.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Download v3.18.0 source package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path input | Out-Null
          gh release download v3.18.0 --repo '${{ github.repository }}' --pattern 'ZKStrap_v3_18_0_UPDATE_CENTER.zip' --dir input
          Expand-Archive -Path 'input/ZKStrap_v3_18_0_UPDATE_CENTER.zip' -DestinationPath source -Force
          $root = Get-ChildItem source -Directory | Select-Object -First 1
          if (-not $root) { throw 'Could not find extracted source.' }
          "ZK_SOURCE=$($root.FullName)" >> $env:GITHUB_ENV

      - name: Decode bootstrap and corrected patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach ($name in @('v3_18_1_base','v3_18_1_post','v3_18_2','v3_18_4')) {
            $b64=(Get-Content "patches/$name.py.gz.b64" -Raw).Trim()
            [IO.File]::WriteAllBytes("$name.gz",[Convert]::FromBase64String($b64))
            python -c "import gzip,pathlib; n='$name'; pathlib.Path(n+'.py').write_bytes(gzip.decompress(pathlib.Path(n+'.gz').read_bytes()))"
            if ($LASTEXITCODE -ne 0) { throw "Failed decoding $name" }
          }
          python patches/v3_18_5_patchfix.py
          if ($LASTEXITCODE -ne 0) { throw 'v3.18.5 bootstrap fix failed' }
          $joined=(Get-ChildItem 'patches/v3214_corrected/part*.b64' | Sort-Object Name | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          if ($joined.Length -ne 50048) { throw "Corrected patch payload length mismatch: $($joined.Length)" }
          [IO.File]::WriteAllBytes('v3_20_14_corrected.gz',[Convert]::FromBase64String($joined))
          python -c "import gzip,pathlib; pathlib.Path('patches/v3_20_14_corrected.py').write_bytes(gzip.decompress(pathlib.Path('v3_20_14_corrected.gz').read_bytes()))"
          if ($LASTEXITCODE -ne 0) { throw 'Corrected patch decode failed' }
          python -m py_compile patches/v3_20_14_corrected.py patches/v3_20_14_final_polish.py patches/v3_20_14_hotfix.py patches/v3_20_14_content_pass.py patches/v3_20_14_clean_icons.py patches/v3_20_14_support_pix.py patches/v3_20_14_support_pix_runner.py
          if ($LASTEXITCODE -ne 0) { throw 'Patch compile validation failed' }

      - name: Rebuild pristine v3.20.13
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:ZK_SOURCE_DIR=$env:ZK_SOURCE
          $patches=@(
            'v3_18_1_base.py','v3_18_1_post.py','v3_18_2.py','patches/v3_18_3.py','v3_18_4.py',
            'patches/v3_18_5.py','patches/v3_18_6.py','patches/v3_18_7.py','patches/v3_18_8.py','patches/v3_18_9.py',
            'patches/v3_19_0.py','patches/v3_19_1.py','patches/v3_19_2.py','patches/v3_19_3.py','patches/v3_19_4_fixed.py',
            'patches/v3_19_5.py','patches/v3_19_6.py','patches/v3_19_7_runtime.py','patches/v3_19_8.py','patches/v3_19_9.py',
            'patches/v3_20_0.py','patches/v3_20_1.py','patches/v3_20_2.py','patches/v3_20_3.py','patches/v3_20_4_onboarding.py',
            'patches/v3_20_4_ani.py','patches/v3_20_5.py','patches/v3_20_6.py','patches/v3_20_7.py','patches/v3_20_8.py',
            'patches/v3_20_9.py','patches/v3_20_10.py','patches/v3_20_11.py','patches/v3_20_12.py','patches/v3_20_13.py','patches/v3_20_13_winapi.py'
          )
          foreach ($patch in $patches) {
            python $patch
            if ($LASTEXITCODE -ne 0) { throw "Patch failed: $patch" }
          }
          python -m py_compile "$env:ZK_SOURCE/ZKStrap_v3_18_0.py"
          if ($LASTEXITCODE -ne 0) { throw 'Pristine source compile failed' }

      - name: Apply v3.20.14 and polished Pix support
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:ZK_SOURCE_DIR=$env:ZK_SOURCE
          foreach ($patch in @(
            'patches/v3_20_14_corrected.py',
            'patches/v3_20_14_final_polish.py',
            'patches/v3_20_14_hotfix.py',
            'patches/v3_20_14_content_pass.py',
            'patches/v3_20_14_clean_icons.py',
            'patches/v3_20_14_support_pix_runner.py'
          )) {
            python $patch
            if ($LASTEXITCODE -ne 0) { throw "Patch failed: $patch" }
          }
          python -m py_compile "$env:ZK_SOURCE/ZKStrap_v3_18_0.py"
          if ($LASTEXITCODE -ne 0) { throw 'Final source compile failed' }

      - name: Validate Pix support page and preserved fixes
        shell: pwsh
        run: |
          @'
          import ast, base64, os, pathlib
          p=pathlib.Path(os.environ['ZK_SOURCE'])/'ZKStrap_v3_18_0.py'
          s=p.read_text(encoding='utf-8')
          t=ast.parse(s)
          app=next(n for n in t.body if isinstance(n,ast.ClassDef) and n.name=='ModernConfigApp')
          methods={n.name:(ast.get_source_segment(s,n) or '') for n in app.body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))}
          page=methods.get('_lazy_build_page_support','')
          if not page: raise SystemExit('support page missing')
          required_text=[
            'APOIE O ZKSTRAP','SUPPORT ZKSTRAP','APOYA ZKSTRAP','支持 ZKSTRAP','SOUTENEZ ZKSTRAP',
            'IA PARA PVP','IA NO APP','INFRA & APIS','SERVIÇOS ONLINE','ESTABILIDADE & TESTES','NOVOS RECURSOS',
            'JÁ APOIEI','O ZKStrap não acessa seu banco nem confirma pagamentos',
            'import base64','from io import BytesIO'
          ]
          missing=[x for x in required_text if x not in page]
          if missing: raise SystemExit('support copy/runtime pieces missing: '+repr(missing))
          if 'COPIAR CHAVE' in page or 'COPY PIX' in page or 'COPIAR PIX' in page:
              raise SystemExit('desktop copy controls should not exist on support page')
          if '"page":"ai"' in s or '("ai","ZK ASSIST")' in s or '"ai": self._lazy_build_page_ai' in s:
              raise SystemExit('ZK Assist exposure regressed')
          if 'if key=="ai": key="feedback"' not in methods.get('show_page',''):
              raise SystemExit('stale ai route redirect regressed')
          marker='_ZK_SUPPORT_QR_B64 = "'
          i=s.find(marker)
          if i<0: raise SystemExit('embedded Pix QR missing')
          j=s.find('"',i+len(marker))
          if j<0: raise SystemExit('embedded Pix QR terminator missing')
          raw=base64.b64decode(s[i+len(marker):j],validate=True)
          if not raw.startswith(b'\x89PNG\r\n\x1a\n') or len(raw)<1000:
              raise SystemExit('embedded Pix QR is not a valid PNG payload')
          print('Pix support page validated: 5 languages, QR, 6 investment cards, thank-you flow, no copy controls')
          '@ | Set-Content validate_support_pix.py -Encoding UTF8
          python validate_support_pix.py
          if ($LASTEXITCODE -ne 0) { throw 'Pix support validation failed' }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:ZK_SOURCE/requirements.txt" pyinstaller

      - name: Reuse validated assets from clean build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path prior_artifact | Out-Null
          gh run download 38341711932 --repo '${{ github.repository }}' --name 'ZKStrap-v3.20.14-clean-icons-win64' --dir prior_artifact
          if ($LASTEXITCODE -ne 0) { throw 'Could not download clean-icons artifact' }
          $inner=Get-ChildItem prior_artifact -Recurse -Filter 'ZKStrap-v3.20.14-clean-icons-win64.zip' | Select-Object -First 1
          if (-not $inner) { throw 'Clean-icons package not found.' }
          Expand-Archive $inner.FullName -DestinationPath prior_app -Force
          $srcAssets=Join-Path (Resolve-Path prior_app) '_internal/zkstrap_assets'
          $dstAssets=Join-Path $env:ZK_SOURCE 'zkstrap_assets'
          if (Test-Path $dstAssets) { Remove-Item $dstAssets -Recurse -Force }
          Copy-Item $srcAssets $dstAssets -Recurse -Force
          Copy-Item (Join-Path (Resolve-Path prior_app) 'ZKUpdater.exe') 'ZKUpdater.exe' -Force
          $packs=Join-Path $dstAssets 'sounds/packs'
          $actual=@(Get-ChildItem $packs -Directory | Select-Object -ExpandProperty Name | Sort-Object)
          $expected=@('abyss','after_hours','final_phase','low_gravity','midnight_exe','neon_heart','overclock','redline','sunset_mode')
          $expected=@($expected | Sort-Object)
          if (($actual -join ',') -ne ($expected -join ',')) { throw "Unexpected sound packs: $($actual -join ',')" }
          Write-Host "Validated asset tree reused with 9 sound packs: $($actual -join ', ')"

      - name: Build ZKStrap ONEDIR
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-Location $env:ZK_SOURCE
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "ZKStrap" `
            --hidden-import "winrt.windows.media.control" --hidden-import "winrt.windows.storage.streams" `
            --hidden-import "winrt.windows.foundation" --hidden-import "winrt.windows.foundation.collections" `
            --collect-all "winrt.windows.media.control" --collect-all "winrt.windows.storage.streams" `
            --collect-all "winrt.windows.foundation" --collect-all "winrt.windows.foundation.collections" `
            --hidden-import "pycaw.pycaw" --hidden-import "pycaw.api.endpointvolume" --hidden-import "comtypes" --hidden-import "comtypes.client" `
            --collect-all "pycaw" --collect-all "comtypes" `
            --icon "zkstrap_icon.ico" --add-data "zkstrap_icon.ico;." --add-data "zkstrap_icon.png;." --add-data "zkstrap_assets;zkstrap_assets" `
            "ZKStrap_v3_18_0.py"
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
          if (-not (Test-Path "dist/ZKStrap/ZKStrap.exe")) { throw 'ZKStrap.exe missing after build.' }
          Copy-Item "$env:GITHUB_WORKSPACE/ZKUpdater.exe" "dist/ZKStrap/ZKUpdater.exe" -Force
          if (-not (Test-Path "dist/ZKStrap/ZKUpdater.exe")) { throw 'ZKUpdater.exe missing after build.' }

      - name: Package Pix support build
        shell: pwsh
        run: |
          $dist=Join-Path $env:ZK_SOURCE 'dist/ZKStrap'
          $name='ZKStrap-v3.20.14-support-pix-win64.zip'
          Compress-Archive -Path "$dist/*" -DestinationPath $name -CompressionLevel Optimal -Force
          $hash=(Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          $size=(Get-Item $name).Length
          Write-Host "SHA256=$hash"
          Write-Host "SIZE=$size"
          "PACKAGE_SHA256=$hash" >> $env:GITHUB_ENV
          "PACKAGE_SIZE=$size" >> $env:GITHUB_ENV

      - name: Upload Pix support artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZKStrap-v3.20.14-support-pix-win64
          path: ZKStrap-v3.20.14-support-pix-win64.zip
          retention-days: 14
          if-no-files-found: error

      - name: Build summary
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY '### ZKStrap v3.20.14 Pix Support candidate'
          Add-Content $env:GITHUB_STEP_SUMMARY 'Polished support page: QR Pix, PT/EN/ES/ZH/FR, six investment cards, thank-you flow.'
          Add-Content $env:GITHUB_STEP_SUMMARY "SHA-256: $env:PACKAGE_SHA256"
          Add-Content $env:GITHUB_STEP_SUMMARY "Size: $env:PACKAGE_SIZE bytes"
