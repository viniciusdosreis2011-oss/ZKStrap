name: Build ZKStrap v3.20.14 Content Pass

on:
  push:
    branches: [work/v3.20.14-corrected]
    paths:
      - '.github/workflows/build-v3.20.14-content-pass.yml'
      - 'patches/v3_20_14_content_pass.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Download v3.18.0 source package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path input | Out-Null
          gh release download v3.18.0 --repo '${{ github.repository }}' --pattern 'ZKStrap_v3_18_0_UPDATE_CENTER.zip' --dir input
          Expand-Archive -Path 'input/ZKStrap_v3_18_0_UPDATE_CENTER.zip' -DestinationPath source -Force
          $root = Get-ChildItem source -Directory | Select-Object -First 1
          if (-not $root) { throw 'Could not find extracted source.' }
          "ZK_SOURCE=$($root.FullName)" >> $env:GITHUB_ENV

      - name: Decode bootstrap and audio tools
        shell: pwsh
        run: |
          foreach ($name in @('v3_18_1_base','v3_18_1_post','v3_18_2','v3_18_4')) {
            $b64=(Get-Content "patches/$name.py.gz.b64" -Raw).Trim()
            [IO.File]::WriteAllBytes("$name.gz",[Convert]::FromBase64String($b64))
            python -c "import gzip,pathlib; n='$name'; pathlib.Path(n+'.py').write_bytes(gzip.decompress(pathlib.Path(n+'.gz').read_bytes()))"
          }
          python patches/v3_18_5_patchfix.py
          $ani=(Get-Content 'tools/test_v3213_ani_parser.py.gz.b64' -Raw).Trim()
          [IO.File]::WriteAllBytes('ani.gz',[Convert]::FromBase64String($ani))
          python -c "import gzip,pathlib; pathlib.Path('tools/test_v3213_ani_parser.py').write_bytes(gzip.decompress(pathlib.Path('ani.gz').read_bytes()))"
          $sfx=(Get-Content 'tools/generate_v3214_sfx.py.gz.b64' -Raw).Trim()
          [IO.File]::WriteAllBytes('sfx.gz',[Convert]::FromBase64String($sfx))
          python -c "import gzip,pathlib; pathlib.Path('tools/generate_v3214_sfx.py').write_bytes(gzip.decompress(pathlib.Path('sfx.gz').read_bytes()))"
          $music=(Get-Content 'tools/generate_v3214_distinct_music.py.gz.b64' -Raw).Trim()
          [IO.File]::WriteAllBytes('music.gz',[Convert]::FromBase64String($music))
          python -c "import gzip,pathlib; pathlib.Path('tools/generate_v3214_distinct_music.py').write_bytes(gzip.decompress(pathlib.Path('music.gz').read_bytes()))"
          $joined=(Get-ChildItem 'patches/v3214_corrected/part*.b64' | Sort-Object Name | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          if ($joined.Length -ne 50048) { throw "Corrected patch payload length mismatch: $($joined.Length)" }
          [IO.File]::WriteAllBytes('v3_20_14_corrected.gz',[Convert]::FromBase64String($joined))
          python -c "import gzip,pathlib; pathlib.Path('patches/v3_20_14_corrected.py').write_bytes(gzip.decompress(pathlib.Path('v3_20_14_corrected.gz').read_bytes()))"
          python -m py_compile patches/v3_20_14_corrected.py patches/v3_20_14_final_polish.py patches/v3_20_14_hotfix.py patches/v3_20_14_content_pass.py tools/generate_v3214_distinct_music.py tools/generate_v3214_sfx.py

      - name: Rebuild pristine v3.20.13
        shell: pwsh
        run: |
          $env:ZK_SOURCE_DIR=$env:ZK_SOURCE
          python v3_18_1_base.py
          python v3_18_1_post.py
          python v3_18_2.py
          python patches/v3_18_3.py
          python v3_18_4.py
          python patches/v3_18_5.py
          python patches/v3_18_6.py
          python patches/v3_18_7.py
          python patches/v3_18_8.py
          python patches/v3_18_9.py
          python patches/v3_19_0.py
          python patches/v3_19_1.py
          python patches/v3_19_2.py
          python patches/v3_19_3.py
          python patches/v3_19_4_fixed.py
          python patches/v3_19_5.py
          python patches/v3_19_6.py
          python patches/v3_19_7_runtime.py
          python patches/v3_19_8.py
          python patches/v3_19_9.py
          python patches/v3_20_0.py
          python patches/v3_20_1.py
          python patches/v3_20_2.py
          python patches/v3_20_3.py
          python patches/v3_20_4_onboarding.py
          python patches/v3_20_4_ani.py
          python patches/v3_20_5.py
          python patches/v3_20_6.py
          python patches/v3_20_7.py
          python patches/v3_20_8.py
          python patches/v3_20_9.py
          python patches/v3_20_10.py
          python patches/v3_20_11.py
          python patches/v3_20_12.py
          python patches/v3_20_13.py
          python patches/v3_20_13_winapi.py
          python -m py_compile "$env:ZK_SOURCE/ZKStrap_v3_18_0.py"
          $hash=(Get-FileHash "$env:ZK_SOURCE/ZKStrap_v3_18_0.py" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '9c0a6f09a6c66a48c50523906c4a74c9fd8441fc19b326eb4e4628552ff0fa17') { throw "Unexpected v3.20.13 source hash: $hash" }

      - name: Apply v3.20.14 chain and content pass
        shell: pwsh
        run: |
          $env:ZK_SOURCE_DIR=$env:ZK_SOURCE
          python patches/v3_20_14_corrected.py
          python patches/v3_20_14_final_polish.py
          python patches/v3_20_14_hotfix.py
          python patches/v3_20_14_content_pass.py
          python -m py_compile "$env:ZK_SOURCE/ZKStrap_v3_18_0.py"
          $hash=(Get-FileHash "$env:ZK_SOURCE/ZKStrap_v3_18_0.py" -Algorithm SHA256).Hash.ToLower()
          Write-Host "CONTENT_PASS_SOURCE_SHA256=$hash"

      - name: Validate content pass
        shell: pwsh
        run: |
          @'
          import ast,os,pathlib
          p=pathlib.Path(os.environ['ZK_SOURCE'])/'ZKStrap_v3_18_0.py';s=p.read_text(encoding='utf-8');t=ast.parse(s)
          app=next(n for n in t.body if isinstance(n,ast.ClassDef) and n.name=='ModernConfigApp')
          m={n.name:(ast.get_source_segment(s,n) or '') for n in app.body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))}
          assigns={}
          for n in t.body:
              if isinstance(n,ast.Assign) and len(n.targets)==1 and isinstance(n.targets[0],ast.Name):assigns[n.targets[0].id]=n
          packs=ast.literal_eval(assigns['AUDIO_PACKS'].value)
          expected=['NEON HEART','OVERCLOCK','MIDNIGHT.exe','AFTER HOURS','REDLINE','ABYSS','FINAL PHASE','LOW GRAVITY','SUNSET MODE']
          if list(packs)!=expected:raise SystemExit(f'wrong audio packs: {list(packs)}')
          default=ast.literal_eval(assigns['DEFAULT_AUDIO_PACK'].value)
          if default!='SUNSET MODE':raise SystemExit('wrong default audio pack')
          if '_spotify_sync_internal_music(playing)' not in m['_spotify_apply_snapshot']:raise SystemExit('Spotify pause hook missing')
          if 'sound_prompted":False' not in m['_owner_prepare_test_profile'] or 'first_run_intro_audio":True' not in m['_owner_prepare_test_profile']:raise SystemExit('First Run Lab audio defaults missing')
          if '_first_run_audio_event(snd)' not in m['_global_click_sound']:raise SystemExit('first-run click SFX route missing')
          if '_ui_pictogram_ctk' not in m['_module_switch'] or '_ui_pictogram_ctk' not in m['_section_card']:raise SystemExit('visual pictograms missing')
          if 'CURSOR ANIMADO' in m['_lazy_build_page_cursor'].upper() or 'ANIMATED CURSOR' in m['_lazy_build_page_cursor'].upper():raise SystemExit('animated cursor returned')
          if 'TAMANHO E HOTSPOT' in m['_lazy_build_page_cursor']:raise SystemExit('cursor page still has split/empty second card')
          if '_aux_scroll_targets' not in m['_install_global_scroll_router'] or 'ZKSmoothScrollFrame' not in m['abrir_modo_compacto']:raise SystemExit('previous scroll hotfix lost')
          if '-topmost' not in m['abrir_modo_compacto']:raise SystemExit('compact topmost lost')
          print('Content pass architecture validation OK')
          '@ | Set-Content validate_content_pass.py -Encoding UTF8
          python validate_content_pass.py

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:ZK_SOURCE/requirements.txt" pyinstaller numpy

      - name: Install official Roblox Tilt assets
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://cms-media.roblox.com/assets/6dd8yllwqeistpspax7k.zip' -OutFile roblox-logo-pack.zip
          Expand-Archive roblox-logo-pack.zip -DestinationPath roblox-logo-pack -Force
          $assetDir=Join-Path $env:ZK_SOURCE 'zkstrap_assets'
          Copy-Item 'roblox-logo-pack/Roblox Logo/Roblox_Tilt_Black.png' (Join-Path $assetDir 'roblox_tilt_black.png') -Force
          Copy-Item 'roblox-logo-pack/Roblox Logo/Roblox_Tilt_White.png' (Join-Path $assetDir 'roblox_tilt_white.png') -Force

      - name: Preserve ABYSS and LOW GRAVITY exactly
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path prior_artifact | Out-Null
          gh run download 38320070553 --repo '${{ github.repository }}' --name 'ZKStrap-v3.20.14-beta-win64' --dir prior_artifact
          $inner=Get-ChildItem prior_artifact -Recurse -Filter 'ZKStrap-v3.20.14-beta-win64.zip' | Select-Object -First 1
          if (-not $inner) { throw 'Previous package not found.' }
          Expand-Archive $inner.FullName -DestinationPath prior_app -Force
          $src=Join-Path (Resolve-Path prior_app) '_internal/zkstrap_assets/sounds/packs'
          $dst=Join-Path $env:ZK_SOURCE 'zkstrap_assets/sounds/packs'
          Copy-Item (Join-Path $src 'abyss/ambient_v3213_abyss.wav') (Join-Path $dst 'abyss/ambient_v3213_abyss.wav') -Force
          Copy-Item (Join-Path $src 'low_gravity/ambient_v3213_low_gravity.wav') (Join-Path $dst 'low_gravity/ambient_v3213_low_gravity.wav') -Force
          $a=(Get-FileHash (Join-Path $dst 'abyss/ambient_v3213_abyss.wav') -Algorithm SHA256).Hash.ToLower()
          $l=(Get-FileHash (Join-Path $dst 'low_gravity/ambient_v3213_low_gravity.wav') -Algorithm SHA256).Hash.ToLower()
          if ($a -ne '0e89bd07eb9a15a24dad25cc31731fe6c3c9aa5cd19bd8520ba53a8a261f894a') { throw "ABYSS changed: $a" }
          if ($l -ne '0498561fafe7222c847944f7937777e5dc701de864bc0f86e988e59c35279591') { throw "LOW GRAVITY changed: $l" }

      - name: Rebuild music and SFX
        shell: pwsh
        run: |
          $env:ZK_SOURCE_DIR=$env:ZK_SOURCE
          python tools/test_v3213_ani_parser.py
          python tools/generate_v3214_distinct_music.py
          python tools/generate_v3214_sfx.py

      - name: Remove excluded sound identities and validate nine packs
        shell: pwsh
        run: |
          $packs=Join-Path $env:ZK_SOURCE 'zkstrap_assets/sounds/packs'
          $keep=@('neon_heart','overclock','midnight_exe','after_hours','redline','abyss','final_phase','low_gravity','sunset_mode')
          Get-ChildItem $packs -Directory | Where-Object { $keep -notcontains $_.Name } | Remove-Item -Recurse -Force
          $actual=@(Get-ChildItem $packs -Directory | Select-Object -ExpandProperty Name | Sort-Object)
          $expected=@($keep | Sort-Object)
          if (($actual -join ',') -ne ($expected -join ',')) { throw "Unexpected pack folders: $($actual -join ',')" }
          $a=(Get-FileHash (Join-Path $packs 'abyss/ambient_v3213_abyss.wav') -Algorithm SHA256).Hash.ToLower()
          $l=(Get-FileHash (Join-Path $packs 'low_gravity/ambient_v3213_low_gravity.wav') -Algorithm SHA256).Hash.ToLower()
          if ($a -ne '0e89bd07eb9a15a24dad25cc31731fe6c3c9aa5cd19bd8520ba53a8a261f894a') { throw 'ABYSS changed after audio build' }
          if ($l -ne '0498561fafe7222c847944f7937777e5dc701de864bc0f86e988e59c35279591') { throw 'LOW GRAVITY changed after audio build' }
          Write-Host "FINAL_PACKS=$($actual -join ', ')"

      - name: Build updater
        shell: pwsh
        run: |
          Set-Location $env:ZK_SOURCE
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "ZKUpdater" --distpath "updater_dist" --workpath "updater_build" --specpath "updater_spec" "ZKUpdater.py"
          if (-not (Test-Path "updater_dist/ZKUpdater.exe")) { throw 'Updater build failed.' }

      - name: Build ZKStrap v3.20.14 ONEDIR
        shell: pwsh
        run: |
          Set-Location $env:ZK_SOURCE
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "ZKStrap" `
            --hidden-import "winrt.windows.media.control" --hidden-import "winrt.windows.storage.streams" `
            --hidden-import "winrt.windows.foundation" --hidden-import "winrt.windows.foundation.collections" `
            --collect-all "winrt.windows.media.control" --collect-all "winrt.windows.storage.streams" `
            --collect-all "winrt.windows.foundation" --collect-all "winrt.windows.foundation.collections" `
            --hidden-import "pycaw.pycaw" --hidden-import "pycaw.api.endpointvolume" --hidden-import "comtypes" --hidden-import "comtypes.client" `
            --collect-all "pycaw" --collect-all "comtypes" `
            --icon "zkstrap_icon.ico" --add-data "zkstrap_icon.ico;." --add-data "zkstrap_icon.png;." --add-data "zkstrap_assets;zkstrap_assets" `
            "ZKStrap_v3_18_0.py"
          if (-not (Test-Path "dist/ZKStrap/ZKStrap.exe")) { throw 'ZKStrap build failed.' }
          Copy-Item "updater_dist/ZKUpdater.exe" "dist/ZKStrap/ZKUpdater.exe" -Force

      - name: Validate packaged sound folders
        shell: pwsh
        run: |
          $packs=Join-Path $env:ZK_SOURCE 'dist/ZKStrap/_internal/zkstrap_assets/sounds/packs'
          $dirs=@(Get-ChildItem $packs -Directory | Select-Object -ExpandProperty Name | Sort-Object)
          if ($dirs.Count -ne 9) { throw "Packaged app contains $($dirs.Count) sound packs instead of 9" }
          Write-Host "PACKAGED_SOUND_PACKS=$($dirs -join ', ')"

      - name: Package content pass
        shell: pwsh
        run: |
          $dist=Join-Path $env:ZK_SOURCE 'dist/ZKStrap'
          $name='ZKStrap-v3.20.14-content-pass-win64.zip'
          Compress-Archive -Path "$dist/*" -DestinationPath $name -CompressionLevel Optimal -Force
          $hash=(Get-FileHash $name -Algorithm SHA256).Hash.ToLower();$size=(Get-Item $name).Length
          Write-Host "PACKAGE=$name"
          Write-Host "SHA256=$hash"
          Write-Host "SIZE=$size"

      - name: Upload content pass artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZKStrap-v3.20.14-content-pass-win64
          path: ZKStrap-v3.20.14-content-pass-win64.zip
          retention-days: 14
          if-no-files-found: error
