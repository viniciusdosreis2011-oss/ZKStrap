name: Release ZKStrap v3.18.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v3.18.3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download v3.18.0 source package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path input | Out-Null
          gh release download v3.18.0 --repo '${{ github.repository }}' --pattern 'ZKStrap_v3_18_0_UPDATE_CENTER.zip' --dir input
          Expand-Archive -Path 'input/ZKStrap_v3_18_0_UPDATE_CENTER.zip' -DestinationPath source -Force
          $root = Get-ChildItem source -Directory | Select-Object -First 1
          if (-not $root) { throw 'Could not find extracted ZKStrap source folder.' }
          "ZK_SOURCE=$($root.FullName)" >> $env:GITHUB_ENV

      - name: Decode patch payloads
        shell: pwsh
        run: |
          foreach ($name in @('v3_18_1_base','v3_18_1_post','v3_18_2')) {
            $b64 = (Get-Content "patches/$name.py.gz.b64" -Raw).Trim()
            [IO.File]::WriteAllBytes("$name.gz", [Convert]::FromBase64String($b64))
            python -c "import gzip,pathlib; n='$name'; pathlib.Path(n+'.py').write_bytes(gzip.decompress(pathlib.Path(n+'.gz').read_bytes()))"
          }

      - name: Apply and validate v3.18.3 patch
        shell: pwsh
        run: |
          $env:ZK_SOURCE_DIR = $env:ZK_SOURCE
          python v3_18_1_base.py
          python v3_18_1_post.py
          python v3_18_2.py
          python patches/v3_18_3.py
          python -m py_compile "$env:ZK_SOURCE/ZKStrap_v3_18_0.py"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:ZK_SOURCE/requirements.txt" pyinstaller

      - name: Build ZKUpdater
        shell: pwsh
        run: |
          Set-Location $env:ZK_SOURCE
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name "ZKUpdater" `
            --distpath "updater_dist" `
            --workpath "updater_build" `
            --specpath "updater_spec" `
            "ZKUpdater.py"
          if (-not (Test-Path "updater_dist/ZKUpdater.exe")) { throw 'ZKUpdater.exe was not generated.' }

      - name: Build ZKStrap v3.18.3 ONEDIR
        shell: pwsh
        run: |
          Set-Location $env:ZK_SOURCE
          python -m PyInstaller --noconfirm --clean --onedir --windowed `
            --name "ZKStrap" `
            --hidden-import "winrt.windows.media.control" `
            --hidden-import "winrt.windows.storage.streams" `
            --hidden-import "winrt.windows.foundation" `
            --hidden-import "winrt.windows.foundation.collections" `
            --collect-all "winrt.windows.media.control" `
            --collect-all "winrt.windows.storage.streams" `
            --collect-all "winrt.windows.foundation" `
            --collect-all "winrt.windows.foundation.collections" `
            --hidden-import "pycaw.pycaw" `
            --hidden-import "pycaw.api.endpointvolume" `
            --hidden-import "comtypes" `
            --hidden-import "comtypes.client" `
            --collect-all "pycaw" `
            --collect-all "comtypes" `
            --icon "zkstrap_icon.ico" `
            --add-data "zkstrap_icon.ico;." `
            --add-data "zkstrap_icon.png;." `
            --add-data "zkstrap_assets;zkstrap_assets" `
            "ZKStrap_v3_18_0.py"
          if (-not (Test-Path "dist/ZKStrap/ZKStrap.exe")) { throw 'ZKStrap.exe was not generated.' }
          Copy-Item "updater_dist/ZKUpdater.exe" "dist/ZKStrap/ZKUpdater.exe" -Force

      - name: Create installable package
        id: pkg
        shell: pwsh
        run: |
          $dist = Join-Path $env:ZK_SOURCE 'dist/ZKStrap'
          $name = 'ZKStrap-v3.18.3-win64.zip'
          Compress-Archive -Path "$dist/*" -DestinationPath $name -CompressionLevel Optimal -Force
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $name).Length
          "name=$name" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "size=$size" >> $env:GITHUB_OUTPUT

      - name: Publish v3.18.3 Stable Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='v3.18.3'
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag '${{ steps.pkg.outputs.name }}' --repo '${{ github.repository }}' --title 'ZKStrap v3.18.3 — First Run Input Hotfix' --notes @'
          ## v3.18.3
          - Corrige o bug de primeiro acesso em que um modal invisível podia capturar todos os cliques do app.
          - Consentimento de áudio agora é um card interno não-modal e nunca bloqueia a interface.
          - Tutorial pode ser aberto mesmo se o aviso de áudio estiver pendente.
          - Vincular/confirmar perfil Roblox não usa mais grab global do mouse.
          - Etapa antiga de Resolução removida do tutorial.
          - F11 e Alt+Enter adicionados como fallback de tela cheia.
          '@
          } else {
            gh release upload $tag '${{ steps.pkg.outputs.name }}' --clobber --repo '${{ github.repository }}'
          }

      - name: Point Stable channel to v3.18.3
        shell: pwsh
        run: |
          $manifest = [ordered]@{
            channel='stable'
            version='3.18.3'
            published_at=(Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            mandatory=$false
            min_updater_version='1.0.0'
            package_url='https://github.com/${{ github.repository }}/releases/download/v3.18.3/${{ steps.pkg.outputs.name }}'
            sha256='${{ steps.pkg.outputs.sha256 }}'
            size_bytes=[int64]'${{ steps.pkg.outputs.size }}'
            notes=@('Hotfix de primeiro acesso: interface não perde mais os cliques.','Áudio de primeiro uso virou card não-modal.','Tutorial e vínculo Roblox continuam clicáveis.','F11 / Alt+Enter: fallback de tela cheia.')
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path channels/stable.json -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add channels/stable.json
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Promote v3.18.3 to Stable'
            git push origin main
          }

      - name: Summary
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY '### ZKStrap v3.18.3 published'
          Add-Content $env:GITHUB_STEP_SUMMARY 'First-run pointer grab hotfix + tutorial/profile interaction fix.'
