name: Release ZKStrap v3.19.7 Beta

on:
  push:
    branches: [main]
    paths:
      - 'i18n/ui_3197_final.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate generated localization pack
        shell: pwsh
        run: |
          @'
          import json,pathlib
          p=pathlib.Path('i18n/ui_3197_final.json')
          if not p.exists():raise SystemExit('Localization pack missing')
          data=json.loads(p.read_text(encoding='utf-8'))
          rows=data.get('rows') or []
          if len(rows)<450:raise SystemExit(f'Localization pack too small: {len(rows)}')
          required={
              'fr':['TABLEAU // ÉTAT EN DIRECT','✓  APPLIQUER LES RÉGLAGES','CENTRE RAPIDE','NON'],
              'es':['PANEL // ESTADO EN VIVO','✓  APLICAR AJUSTES','CENTRO RÁPIDO'],
              'zh':['仪表盘 // 实时状态','✓  应用设置','快捷中心'],
          }
          for lang,vals in required.items():
              present={r.get(lang,'') for r in rows}
              missing=[v for v in vals if v not in present]
              if missing:raise SystemExit(f'{lang} manual UI polish missing: {missing}')
          print('Localization pack OK:',len(rows),data.get('stats'))
          '@ | Set-Content validate_i18n_pack.py -Encoding UTF8
          python validate_i18n_pack.py

      - name: Download v3.18.0 source package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path input | Out-Null
          gh release download v3.18.0 --repo '${{ github.repository }}' --pattern 'ZKStrap_v3_18_0_UPDATE_CENTER.zip' --dir input
          Expand-Archive -Path 'input/ZKStrap_v3_18_0_UPDATE_CENTER.zip' -DestinationPath source -Force
          $root = Get-ChildItem source -Directory | Select-Object -First 1
          if (-not $root) { throw 'Could not find extracted source.' }
          "ZK_SOURCE=$($root.FullName)" >> $env:GITHUB_ENV

      - name: Decode previous patch payloads
        shell: pwsh
        run: |
          foreach ($name in @('v3_18_1_base','v3_18_1_post','v3_18_2','v3_18_4')) {
            $b64 = (Get-Content "patches/$name.py.gz.b64" -Raw).Trim()
            [IO.File]::WriteAllBytes("$name.gz", [Convert]::FromBase64String($b64))
            python -c "import gzip,pathlib; n='$name'; pathlib.Path(n+'.py').write_bytes(gzip.decompress(pathlib.Path(n+'.gz').read_bytes()))"
          }
          python patches/v3_18_5_patchfix.py

      - name: Validate patch scripts
        shell: pwsh
        run: |
          python -m py_compile patches/v3_18_5.py patches/v3_18_6.py patches/v3_18_7.py patches/v3_18_8.py patches/v3_18_9.py patches/v3_19_0.py patches/v3_19_1.py patches/v3_19_2.py patches/v3_19_3.py patches/v3_19_4_fixed.py patches/v3_19_5.py patches/v3_19_6.py patches/v3_19_7.py

      - name: Rebuild and validate v3.19.7
        shell: pwsh
        run: |
          $env:ZK_SOURCE_DIR = $env:ZK_SOURCE
          python v3_18_1_base.py
          python v3_18_1_post.py
          python v3_18_2.py
          python patches/v3_18_3.py
          python v3_18_4.py
          python patches/v3_18_5.py
          python patches/v3_18_6.py
          python patches/v3_18_7.py
          python patches/v3_18_8.py
          python patches/v3_18_9.py
          python patches/v3_19_0.py
          python patches/v3_19_1.py
          python patches/v3_19_2.py
          python patches/v3_19_3.py
          python patches/v3_19_4_fixed.py
          python patches/v3_19_5.py
          python patches/v3_19_6.py
          python patches/v3_19_7.py
          python -m py_compile "$env:ZK_SOURCE/ZKStrap_v3_18_0.py"
          @'
          import ast,os,pathlib,re
          p=pathlib.Path(os.environ['ZK_SOURCE'])/'ZKStrap_v3_18_0.py'
          src=p.read_text(encoding='utf-8')
          tree=ast.parse(src)
          app=next((n for n in tree.body if isinstance(n,ast.ClassDef) and n.name=='ModernConfigApp'),None)
          if app is None:raise SystemExit('ModernConfigApp missing')
          methods={n.name for n in app.body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))}
          required_methods={'_L','_i18n_text','_translate_widget_tree','_i18n_runtime_tick','aplicar_idioma','_maybe_show_first_run_language','_queue_scroll_step'}
          missing=sorted(required_methods-methods)
          if missing:raise SystemExit('Missing i18n/runtime methods: '+', '.join(missing))
          checks={
              'version':'APP_VERSION = "3.19.7"',
              'embedded pack':'I18N_UI_3197_ROWS',
              'runtime index':'I18N_UI_3197_INDEX',
              'French Home':'TABLEAU // ÉTAT EN DIRECT',
              'French Apply':'APPLIQUER LES RÉGLAGES',
              'Spanish Home':'PANEL // ESTADO EN VIVO',
              'Chinese Home':'仪表盘 // 实时状态',
              'visible language controls':'INTERFACE & IDIOMA',
              'five language menu':'values=["Português","English","Español","中文","Français"]',
              'clean tutorial':'ZK // GUIA RÁPIDO',
              'native updates':'update_changelog_text',
          }
          for name,needle in checks.items():
              if needle not in src:raise SystemExit('Missing '+name)
          forbidden={
              'unsafe repaint':'RedrawWindow(',
              'legacy CTk scroll':'ctk.CTkScrollableFrame(',
              'forced font size 11':'child.configure(font=(self.fonte_ui,11))',
              'tutorial mission':'self._tutorial_mission.configure(text=mission)',
          }
          for name,needle in forbidden.items():
              if needle in src:raise SystemExit('Forbidden surface returned: '+name)
          remaining=[]
          for node in ast.walk(app):
              if isinstance(node,ast.IfExp) and isinstance(node.body,ast.Constant) and isinstance(node.body.value,str) and isinstance(node.orelse,ast.Constant) and isinstance(node.orelse.value,str):
                  try:cond=ast.unparse(node.test)
                  except Exception:cond=''
                  if 'pt' in cond or 'idioma' in cond or 'language' in cond:remaining.append((node.lineno,cond))
          if len(remaining)>3:raise SystemExit(f'Legacy PT/EN fallbacks remain: {remaining[:10]}')
          print('v3.19.7 structural i18n validation OK; legacy fallbacks',len(remaining))
          '@ | Set-Content validate_3197.py -Encoding UTF8
          python validate_3197.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:ZK_SOURCE/requirements.txt" pyinstaller

      - name: Build updater
        shell: pwsh
        run: |
          Set-Location $env:ZK_SOURCE
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "ZKUpdater" --distpath "updater_dist" --workpath "updater_build" --specpath "updater_spec" "ZKUpdater.py"
          if (-not (Test-Path "updater_dist/ZKUpdater.exe")) { throw 'Updater build failed.' }

      - name: Build ZKStrap v3.19.7 ONEDIR
        shell: pwsh
        run: |
          Set-Location $env:ZK_SOURCE
          python -m PyInstaller --noconfirm --clean --onedir --windowed `
            --name "ZKStrap" `
            --hidden-import "winrt.windows.media.control" `
            --hidden-import "winrt.windows.storage.streams" `
            --hidden-import "winrt.windows.foundation" `
            --hidden-import "winrt.windows.foundation.collections" `
            --collect-all "winrt.windows.media.control" `
            --collect-all "winrt.windows.storage.streams" `
            --collect-all "winrt.windows.foundation" `
            --collect-all "winrt.windows.foundation.collections" `
            --hidden-import "pycaw.pycaw" `
            --hidden-import "pycaw.api.endpointvolume" `
            --hidden-import "comtypes" `
            --hidden-import "comtypes.client" `
            --collect-all "pycaw" `
            --collect-all "comtypes" `
            --icon "zkstrap_icon.ico" `
            --add-data "zkstrap_icon.ico;." `
            --add-data "zkstrap_icon.png;." `
            --add-data "zkstrap_assets;zkstrap_assets" `
            "ZKStrap_v3_18_0.py"
          if (-not (Test-Path "dist/ZKStrap/ZKStrap.exe")) { throw 'ZKStrap build failed.' }
          Copy-Item "updater_dist/ZKUpdater.exe" "dist/ZKStrap/ZKUpdater.exe" -Force

      - name: Package
        id: pkg
        shell: pwsh
        run: |
          $dist = Join-Path $env:ZK_SOURCE 'dist/ZKStrap'
          $name='ZKStrap-v3.19.7-beta-win64.zip'
          Compress-Archive -Path "$dist/*" -DestinationPath $name -CompressionLevel Optimal -Force
          $hash=(Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          $size=(Get-Item $name).Length
          "name=$name" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "size=$size" >> $env:GITHUB_OUTPUT

      - name: Publish v3.19.7 Beta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='v3.19.7-beta'
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag '${{ steps.pkg.outputs.name }}' --repo '${{ github.repository }}' --prerelease --title 'ZKStrap v3.19.7 Beta — Full UI Localization' --notes @'
          ## v3.19.7 Beta
          - Reworks localization globally instead of translating only the sidebar.
          - Converts hundreds of old Portuguese/English-only UI branches to the five-language resolver.
          - Adds an embedded offline localization pack for Português, English, Español, 中文 and Français.
          - Hard-coded labels, buttons, descriptions and lazy-loaded pages receive a runtime translation pass.
          - Dynamic Home values such as ONLINE, active optimizations, CURSOR/FONT and restart state now follow the selected language.
          - French Home and command-bar wording received manual product-language polish.
          - Keeps v3.19.6 typography, Personalizar layout, splash, tutorial and safe Canvas scrolling.
          - Stable remains unchanged while this Beta is tested.
          '@
          } else {
            gh release upload $tag '${{ steps.pkg.outputs.name }}' --clobber --repo '${{ github.repository }}'
          }

      - name: Update Beta manifest
        shell: pwsh
        run: |
          $m=[ordered]@{
            channel='beta';version='3.19.7';published_at=(Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ');mandatory=$false;min_updater_version='1.0.0';
            package_url='https://github.com/${{ github.repository }}/releases/download/v3.19.7-beta/ZKStrap-v3.19.7-beta-win64.zip';sha256='${{ steps.pkg.outputs.sha256 }}';size_bytes=[int64]'${{ steps.pkg.outputs.size }}';
            notes=@('Internacionalização refeita globalmente: não fica mais limitada à sidebar.','Centenas de textos PT/EN antigos agora usam o resolvedor de 5 idiomas.','Textos fixos, páginas lazy e status dinâmicos passam pelo pacote de idioma offline.','Home em francês recebeu revisão manual nos principais títulos, botões e status.','Mantém tipografia menor, Personalizar organizado, splash, tutorial e scroll seguro da v3.19.6.','Stable continua na 3.18.8 até aprovação desta Beta.')
          }
          $m|ConvertTo-Json -Depth 5|Set-Content channels/beta.json -Encoding UTF8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add channels/beta.json
          git commit -m 'Point Beta channel to ZKStrap v3.19.7'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Summary
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY '### ZKStrap v3.19.7 Beta published'
          Add-Content $env:GITHUB_STEP_SUMMARY 'Global five-language localization + runtime i18n sweep.'
          Add-Content $env:GITHUB_STEP_SUMMARY 'SHA-256: ${{ steps.pkg.outputs.sha256 }}'
          Add-Content $env:GITHUB_STEP_SUMMARY 'Size: ${{ steps.pkg.outputs.size }} bytes'
