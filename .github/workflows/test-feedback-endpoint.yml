name: Test ZKStrap Feedback Endpoint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-feedback-endpoint.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: POST test report
        shell: bash
        run: |
          set -e
          code=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "https://zkstrap-support-api.vercel.app/api/report" \
            -H "Content-Type: application/json" \
            --data '{"source":"zkstrap-client","type":"Teste interno","title":"Teste do endpoint","message":"Teste automatico do sistema de relatorios do ZKStrap.","app_version":"3.18.5","diagnostics":{"app_version":"3.18.5","os":"GitHub Actions test","theme":"ZKStrap Core","update_channel":"stable","safe_start":false},"recent_logs":["[test] endpoint check"]}')
          echo "HTTP $code"
          cat response.json
          test "$code" = "200"

# rerun after Edge migration
