name: Build ZKStrap v3.20.23 Reliable Updater

on:
  push:
    branches: [work/v3.20.14-corrected]
    paths:
      - '.github/workflows/build-v3.20.23-reliable-updater.yml'
      - 'patches/v3_20_21_launch_hotfix.py'
      - 'patches/v3_20_22_cursor_layout_fix.py'
      - 'patches/v3_20_23_updater_reliability.py'
      - 'tools/updater/ZKUpdater_v1_1.py'
      - 'patches/v3_20_20_finalpost_freeze.py'
      - 'release-assets/v3.20.20-final/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - name: Download v3.18.0 source package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path input | Out-Null
          gh release download v3.18.0 --repo '${{ github.repository }}' --pattern 'ZKStrap_v3_18_0_UPDATE_CENTER.zip' --dir input
          Expand-Archive -Path 'input/ZKStrap_v3_18_0_UPDATE_CENTER.zip' -DestinationPath source -Force
          $root=Get-ChildItem source -Directory | Select-Object -First 1
          if (-not $root) { throw 'Could not find extracted source.' }
          "ZK_SOURCE=$($root.FullName)" >> $env:GITHUB_ENV

      - name: Decode bootstrap patches
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach ($name in @('v3_18_1_base','v3_18_1_post','v3_18_2','v3_18_4')) {
            $b64=(Get-Content "patches/$name.py.gz.b64" -Raw).Trim()
            [IO.File]::WriteAllBytes("$name.gz",[Convert]::FromBase64String($b64))
            python -c "import gzip,pathlib; n='$name'; pathlib.Path(n+'.py').write_bytes(gzip.decompress(pathlib.Path(n+'.gz').read_bytes()))"
            if ($LASTEXITCODE -ne 0) { throw "Failed decoding $name" }
          }
          python patches/v3_18_5_patchfix.py
          if ($LASTEXITCODE -ne 0) { throw 'v3.18.5 bootstrap fix failed' }
          $joined=(Get-ChildItem 'patches/v3214_corrected/part*.b64' | Sort-Object Name | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          if ($joined.Length -ne 50048) { throw "Corrected patch payload length mismatch: $($joined.Length)" }
          [IO.File]::WriteAllBytes('v3_20_14_corrected.gz',[Convert]::FromBase64String($joined))
          python -c "import gzip,pathlib; pathlib.Path('patches/v3_20_14_corrected.py').write_bytes(gzip.decompress(pathlib.Path('v3_20_14_corrected.gz').read_bytes()))"

      - name: Rebuild exact v3.20.20 source and apply Final Post patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:ZK_SOURCE_DIR=$env:ZK_SOURCE
          $patches=@(
            'v3_18_1_base.py','v3_18_1_post.py','v3_18_2.py','patches/v3_18_3.py','v3_18_4.py',
            'patches/v3_18_5.py','patches/v3_18_6.py','patches/v3_18_7.py','patches/v3_18_8.py','patches/v3_18_9.py',
            'patches/v3_19_0.py','patches/v3_19_1.py','patches/v3_19_2.py','patches/v3_19_3.py','patches/v3_19_4_fixed.py',
            'patches/v3_19_5.py','patches/v3_19_6.py','patches/v3_19_7_runtime.py','patches/v3_19_8.py','patches/v3_19_9.py',
            'patches/v3_20_0.py','patches/v3_20_1.py','patches/v3_20_2.py','patches/v3_20_3.py','patches/v3_20_4_onboarding.py',
            'patches/v3_20_4_ani.py','patches/v3_20_5.py','patches/v3_20_6.py','patches/v3_20_7.py','patches/v3_20_8.py',
            'patches/v3_20_9.py','patches/v3_20_10.py','patches/v3_20_11.py','patches/v3_20_12.py','patches/v3_20_13.py','patches/v3_20_13_winapi.py',
            'patches/v3_20_14_corrected.py','patches/v3_20_14_final_polish.py','patches/v3_20_14_hotfix.py','patches/v3_20_14_content_pass.py','patches/v3_20_14_clean_icons.py',
            'patches/v3_20_15_release_runner.py','patches/v3_20_16_release_polish.py','patches/v3_20_16_theme_swap_cleanup.py','patches/v3_20_17_scroll_and_collapsible.py','patches/v3_20_18_restore_scroll.py','patches/v3_20_19_final_candidate.py','patches/v3_20_20_post_ready_runner.py',
            'patches/v3_20_20_finalpost_freeze.py','patches/v3_20_21_launch_hotfix.py','patches/v3_20_22_cursor_layout_fix.py','patches/v3_20_23_updater_reliability.py'
          )
          foreach ($patch in $patches) {
            python $patch
            if ($LASTEXITCODE -ne 0) { throw "Patch failed: $patch" }
          }
          python -m py_compile "$env:ZK_SOURCE/ZKStrap_v3_18_0.py"
          if ($LASTEXITCODE -ne 0) { throw 'Final source compile failed' }
          $src=Get-Content "$env:ZK_SOURCE/ZKStrap_v3_18_0.py" -Raw
          if ($src -notmatch 'intense_days=33' -or $src -notmatch 'intense_hours=792') { throw '33-day freeze missing' }
          if ($src -notmatch 'APP_VERSION = "3.20.23"') { throw 'Wrong app version' }

      - name: Validate cursor hotfix behavior and layout
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import ast,os,pathlib
          source=(pathlib.Path(os.environ["ZK_SOURCE"])/"ZKStrap_v3_18_0.py").read_text(encoding="utf-8")
          tree=ast.parse(source)
          cls=next(n for n in tree.body if isinstance(n,ast.ClassDef) and n.name=="ModernConfigApp")
          methods={n.name:ast.get_source_segment(source,n) for n in cls.body if isinstance(n,ast.FunctionDef)}
          assert 'APP_VERSION = "3.20.23"' in source
          assert "_update_startup_health_check" in source
          assert "self.after(2200, self._update_startup_health_check)" in source
          assert 'tutorial_first_run_seen.flag' in source
          page=methods["_lazy_build_page_cursor"]
          selector=methods["evento_cursor_pack"]
          apply=methods["aplicar_cursor_selecionado"]
          assert 'self.btn_apply_cursor' in page
          assert 'self.btn_restore_cursor' in page
          assert 'self.importar_cursor_png' in page
          assert 'self.importar_cursor_pack_pasta' in page
          assert page.index('self.btn_apply_cursor') < page.index('self.cursor_preview_label')
          assert 'expand=False' in page
          assert 'self._cursor_pending_pack=pack' in selector
          assert 'self.aplicar_cursor_pack(' not in selector
          assert 'self.aplicar_cursor_pack(pack)' in apply
          for name in ('importar_cursor_png','importar_cursor_pack_pasta'):
              assert 'self._cursor_pending_pack = nome' in methods[name]
              assert 'self.aplicar_cursor_pack(nome)' not in methods[name]
          print("Cursor UI and manual-apply validation passed")
          '@ | Set-Content validate_cursor.py -Encoding utf8
          python validate_cursor.py
          if ($LASTEXITCODE -ne 0) { throw 'Cursor hotfix validation failed' }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:ZK_SOURCE/requirements.txt" pyinstaller

      - name: Test and build independent ZKUpdater
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m py_compile tools/updater/ZKUpdater_v1_1.py
          if ($LASTEXITCODE -ne 0) { throw 'Updater source failed syntax test' }
          @'
          import hashlib,pathlib,subprocess,sys,zipfile
          root=pathlib.Path.cwd()
          scratch=root/"zk_updater_test"
          install=scratch/"install"
          backup=scratch/"backups"
          install.mkdir(parents=True,exist_ok=True)
          (install/"ZKStrap.exe").write_bytes(b"old EXE")
          (install/"ZKUpdater.exe").write_bytes(b"old updater")
          pkg=scratch/"candidate.zip"
          with zipfile.ZipFile(pkg,"w") as z:
              z.writestr("ZKStrap.exe",b"new EXE")
              z.writestr("ZKUpdater.exe",b"new updater")
              z.writestr("ZKStrap-version.txt","3.20.23")
          sha=hashlib.sha256(pkg.read_bytes()).hexdigest()
          argv=[sys.executable,str(root/"tools/updater/ZKUpdater_v1_1.py"),
                "--apply",str(pkg),"--sha256",sha,
                "--install-dir",str(install),"--backup-dir",str(backup),
                "--wait-pid","0","--relaunch","",
                "--from-version","3.20.22","--to-version","3.20.23"]
          completed=subprocess.run(argv,capture_output=True,text=True,timeout=100)
          assert completed.returncode==0,completed.stderr
          assert (install/"ZKStrap.exe").read_bytes()==b"new EXE"
          assert (install/"ZKUpdater.exe").read_bytes()==b"new updater"
          assert len(list(backup.glob("*.zip")))==1
          print("Updater installation smoke test PASSED")
          '@ | Set-Content validate_updater.py -Encoding utf8
          python validate_updater.py
          if ($LASTEXITCODE -ne 0) { throw 'Updater smoke test failed' }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ZKUpdater `
            --distpath "$env:GITHUB_WORKSPACE/updater_dist" `
            --workpath "$env:GITHUB_WORKSPACE/updater_build" `
            --specpath "$env:GITHUB_WORKSPACE/updater_spec" `
            tools/updater/ZKUpdater_v1_1.py
          if ($LASTEXITCODE -ne 0) { throw 'Failed to compile corrected ZKUpdater.exe' }
          if (-not (Test-Path "$env:GITHUB_WORKSPACE/updater_dist/ZKUpdater.exe")) { throw 'New ZKUpdater.exe missing' }

      - name: Reuse validated release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path prior | Out-Null
          gh release download v3.20.16 --repo '${{ github.repository }}' --pattern 'ZKStrap-v3.20.16-win64.zip' --dir prior
          Expand-Archive 'prior/ZKStrap-v3.20.16-win64.zip' -DestinationPath prior_app -Force
          $srcAssets=Join-Path (Resolve-Path prior_app) '_internal/zkstrap_assets'
          $dstAssets=Join-Path $env:ZK_SOURCE 'zkstrap_assets'
          if (Test-Path $dstAssets) { Remove-Item $dstAssets -Recurse -Force }
          Copy-Item $srcAssets $dstAssets -Recurse -Force
          # Replace legacy updater with the newly built one.

      - name: Build ZKStrap ONEDIR
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-Location $env:ZK_SOURCE
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "ZKStrap" `
            --hidden-import "winrt.windows.media.control" --hidden-import "winrt.windows.storage.streams" `
            --hidden-import "winrt.windows.foundation" --hidden-import "winrt.windows.foundation.collections" `
            --collect-all "winrt.windows.media.control" --collect-all "winrt.windows.storage.streams" `
            --collect-all "winrt.windows.foundation" --collect-all "winrt.windows.foundation.collections" `
            --hidden-import "pycaw.pycaw" --hidden-import "pycaw.api.endpointvolume" --hidden-import "comtypes" --hidden-import "comtypes.client" `
            --collect-all "pycaw" --collect-all "comtypes" `
            --icon "zkstrap_icon.ico" --add-data "zkstrap_icon.ico;." --add-data "zkstrap_icon.png;." --add-data "zkstrap_assets;zkstrap_assets" `
            "ZKStrap_v3_18_0.py"
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
          $dist=Join-Path $env:ZK_SOURCE 'dist/ZKStrap'
          Copy-Item "$env:GITHUB_WORKSPACE/updater_dist/ZKUpdater.exe" "$dist/ZKUpdater.exe" -Force
          Set-Content -Path "$dist/ZKStrap-version.txt" -Value "3.20.23" -NoNewline -Encoding utf8
          Copy-Item "$env:GITHUB_WORKSPACE/release-assets/v3.20.20-final/ZKStrap-Downloads.html" "$dist/ZKStrap-Downloads.html" -Force
          Copy-Item "$env:GITHUB_WORKSPACE/release-assets/v3.20.20-final/VER DOWNLOADS.bat" "$dist/VER DOWNLOADS.bat" -Force

      - name: Package and validate Final Post
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dist=Join-Path $env:ZK_SOURCE 'dist/ZKStrap'
          foreach ($f in @('ZKStrap.exe','ZKUpdater.exe','ZKStrap-version.txt','ZKStrap-Downloads.html','VER DOWNLOADS.bat')) {
            if (-not (Test-Path (Join-Path $dist $f))) { throw "Missing final file: $f" }
          }
          $name='ZKStrap-v3.20.23-win64.zip'
          Compress-Archive -Path "$dist/*" -DestinationPath $name -CompressionLevel Optimal -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z=[IO.Compression.ZipFile]::OpenRead((Resolve-Path $name))
          try {
            $names=@($z.Entries | ForEach-Object { $_.FullName.Replace('\','/') })
            foreach ($required in @('ZKStrap.exe','ZKUpdater.exe','ZKStrap-version.txt','ZKStrap-Downloads.html','VER DOWNLOADS.bat')) {
              if ($names -notcontains $required) { throw "ZIP missing $required" }
            }
          } finally { $z.Dispose() }
          $hash=(Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          $size=(Get-Item $name).Length
          "PACKAGE_SHA256=$hash" >> $env:GITHUB_ENV
          "PACKAGE_SIZE=$size" >> $env:GITHUB_ENV
          Write-Host "FINAL POST SHA256=$hash SIZE=$size"

      - name: Upload Final Post artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZKStrap-v3.20.23-reliable-updater-win64
          path: ZKStrap-v3.20.23-win64.zip
          retention-days: 14
          if-no-files-found: error

      - name: Publish public v3.20.23 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release create v3.20.23 ZKStrap-v3.20.23-win64.zip --repo '${{ github.repository }}' --target '${{ github.sha }}' --title 'ZKStrap v3.20.23 — Updater Reliability' --notes 'Corrige o ZKUpdater: erros visíveis, diagnóstico ao reabrir, aviso sobre instalações em ZIP/pastas temporárias e confirma o diretório atualizado. Inclui as correções do cursor da v3.20.22.' --latest
          if ($LASTEXITCODE -ne 0) { throw 'Github Release upload failed' }

      - name: Summary
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY '### ZKStrap v3.20.23 UPDATER RELIABILITY'
          Add-Content $env:GITHUB_STEP_SUMMARY 'Intensive development phase frozen at 33 days / 792 h. Download analytics dashboard included.'
          Add-Content $env:GITHUB_STEP_SUMMARY "SHA-256: $env:PACKAGE_SHA256"
          Add-Content $env:GITHUB_STEP_SUMMARY "Size: $env:PACKAGE_SIZE bytes"
