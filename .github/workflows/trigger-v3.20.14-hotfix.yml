name: Trigger ZKStrap v3.20.14 Hotfix

on:
  push:
    branches: [work/v3.20.14-corrected]
    paths:
      - '.github/workflows/trigger-v3.20.14-hotfix.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch hotfix workflow on latest branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-v3.20.14-hotfix.yml --repo '${{ github.repository }}' --ref work/v3.20.14-corrected
