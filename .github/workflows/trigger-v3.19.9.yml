name: Trigger ZKStrap v3.19.9 Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-v3.19.9.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch v3.19.9 release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-v3.19.9-beta.yml --repo '${{ github.repository }}' --ref main
