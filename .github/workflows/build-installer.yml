name: Build ZKStrap Installer

on:
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - '.github/workflows/build-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract installer source
        shell: pwsh
        run: |
          $b64 = (Get-Content "installer/source_payload.b64" -Raw).Trim()
          [IO.File]::WriteAllBytes("installer/installer_source_payload.zip", [Convert]::FromBase64String($b64))
          New-Item -ItemType Directory -Force -Path installer/source | Out-Null
          Expand-Archive -Path installer/installer_source_payload.zip -DestinationPath installer/source -Force

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: installer/source/requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r installer/source/requirements.txt

      - name: Generate installer download icon
        shell: pwsh
        run: |
          @'
          from PIL import Image, ImageDraw
          from pathlib import Path

          out = Path("installer/source")
          size = 256
          img = Image.new("RGBA", (size, size), (0, 0, 0, 0))
          d = ImageDraw.Draw(img)

          # ZKStrap purple tile
          d.rounded_rectangle((12, 12, 244, 244), radius=58, fill=(151, 77, 255, 255))

          # Geometric Z mark
          dark = (12, 12, 16, 255)
          d.polygon([(48, 58), (166, 58), (150, 84), (48, 84)], fill=dark)
          d.polygon([(144, 80), (174, 80), (91, 190), (58, 190)], fill=dark)
          d.polygon([(58, 178), (160, 178), (160, 204), (58, 204)], fill=dark)

          # Download badge
          cx, cy, r = 192, 192, 47
          d.ellipse((cx-r, cy-r, cx+r, cy+r), fill=(19, 20, 28, 255), outline=(238, 231, 255, 255), width=4)
          white = (255, 255, 255, 255)
          d.rounded_rectangle((cx-7, cy-28, cx+7, cy+9), radius=5, fill=white)
          d.polygon([(cx-24, cy+1), (cx, cy+26), (cx+24, cy+1), (cx+10, cy+1), (cx+10, cy-4), (cx-10, cy-4), (cx-10, cy+1)], fill=white)
          d.rounded_rectangle((cx-28, cy+31, cx+28, cy+39), radius=4, fill=white)

          img.save(out / "zkstrap_icon.png", optimize=True)
          img.save(out / "zkstrap_icon.ico", format="ICO", sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | python -

      - name: Build single EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name "ZKStrapInstaller" `
            --collect-all customtkinter `
            --icon "installer/source/zkstrap_icon.ico" `
            --add-data "installer/source/zkstrap_icon.png;." `
            --add-data "installer/source/zkstrap_icon.ico;." `
            --distpath "dist_installer" `
            --workpath "build_installer" `
            "installer/source/ZKStrapInstaller.py"

          if (-not (Test-Path "dist_installer/ZKStrapInstaller.exe")) {
            throw "ZKStrapInstaller.exe was not generated."
          }

      - name: Calculate SHA-256
        id: hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist_installer/ZKStrapInstaller.exe" -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          $hash | Out-File -FilePath "dist_installer/ZKStrapInstaller.exe.sha256" -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZKStrapInstaller
          path: |
            dist_installer/ZKStrapInstaller.exe
            dist_installer/ZKStrapInstaller.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish fixed installer download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "installer-latest"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo "${{ github.repository }}" `
              --title "ZKStrap Installer - Fixed Download" `
              --notes "Rolling installer build. The ZKStrapInstaller.exe asset is replaced automatically." `
              --prerelease
          }

          gh release upload $tag "dist_installer/ZKStrapInstaller.exe" --clobber --repo "${{ github.repository }}"
          gh release upload $tag "dist_installer/ZKStrapInstaller.exe.sha256" --clobber --repo "${{ github.repository }}"

      - name: Summary
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### ZKStrap Installer ready"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "SHA-256: ${{ steps.hash.outputs.sha256 }}"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Fixed URL: https://github.com/${{ github.repository }}/releases/download/installer-latest/ZKStrapInstaller.exe"
